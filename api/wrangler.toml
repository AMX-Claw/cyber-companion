name = "xiaoke-api"
main = "worker.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "xiaoke-db"
database_id = "51cdbaa0-5f7c-452e-a2af-fa990df8d217"

# R2头像上传暂时关闭（需要在Cloudflare Dashboard启用R2）
# [[r2_buckets]]
# binding = "AVATAR_BUCKET"
# bucket_name = "xiaoke-avatars"

# GEMINI_API_KEY: set via `wrangler secret put GEMINI_API_KEY` — never in plaintext here

# Cron Trigger: 每天 UTC 13:45 ≈ AEST 23:45 (或 AEDT 00:45 次日) 自动生成当日日记
# 时间选在 AEST 23:45 是为了在日终前刚好捕获一整天的活动。
# DST: AEDT 期 (Oct–Apr) 触发时已跨过午夜，worker getAEDTDateString() 会记录为昨天的日期——需要时手动调整偏移
[triggers]
crons = ["45 13 * * *"]

# 鉴权 token 用 wrangler secret 设置：
# wrangler secret put DADDY_TOKEN
# wrangler secret put MAMA_TOKEN
